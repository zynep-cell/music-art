<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Müzik & Beat Stüdyosu 🎧</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d0e15;
      color: #f1f2f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
    }
    header { text-align: center; margin-bottom: 20px; }
    h1 { font-size: 1.8rem; letter-spacing: -0.5px; }
    p { font-size: 0.85rem; color: #82869e; margin-top: 4px; }

    .studio-container {
      background: #151622;
      border: 1px solid #282a3c;
      border-radius: 16px;
      padding: 20px;
      max-width: 960px;
      width: 100%;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    }

    /* Üst Kontrol Çubuğu */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #232535;
    }
    .btn-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    
    button {
      background: #242738;
      color: #fff;
      border: 1px solid #34384e;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:hover { background: #32364c; border-color: #484d6b; }
    button.play-active { background: #6366f1; border-color: #818cf8; }
    button.record-active { background: #ef4444; border-color: #f87171; animation: pulse 1s infinite; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

    .control-label {
      font-size: 0.8rem;
      color: #9da1b9;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    input[type="range"] { accent-color: #6366f1; cursor: pointer; width: 90px; }
    input[type="text"] {
      background: #1d1f2d;
      border: 1px solid #34384e;
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    /* Grid / Sekans Alanı */
    .sequencer-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .track-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .track-info {
      width: 110px;
      flex-shrink: 0;
      font-size: 0.82rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .steps-container {
      display: grid;
      grid-template-columns: repeat(16, 1fr);
      gap: 6px;
      flex-grow: 1;
    }
    .step-btn {
      aspect-ratio: 1;
      min-width: 32px;
      max-width: 44px;
      background: #1c1e2b;
      border: 1px solid #2a2d3e;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.1s, transform 0.05s;
    }
    .step-btn:hover { background: #282b3d; }
    /* Her 4 vuruşta bir ayrım */
    .steps-container .step-btn:nth-child(4n) { margin-right: 5px; }

    /* Aktif Nota Renkleri */
    .step-btn.active.kick { background: #ef4444; box-shadow: 0 0 8px rgba(239, 68, 68, 0.4); }
    .step-btn.active.snare { background: #f97316; box-shadow: 0 0 8px rgba(249, 115, 22, 0.4); }
    .step-btn.active.hihat { background: #eab308; box-shadow: 0 0 8px rgba(234, 179, 8, 0.4); }
    .step-btn.active.bass { background: #8b5cf6; box-shadow: 0 0 8px rgba(139, 92, 246, 0.4); }
    .step-btn.active.chords { background: #3b82f6; box-shadow: 0 0 8px rgba(59, 130, 246, 0.4); }
    .step-btn.active.melody { background: #10b981; box-shadow: 0 0 8px rgba(16, 185, 129, 0.4); }

    /* Çalan Adım Vurgusu */
    .step-btn.playing {
      border-color: #ffffff;
      transform: scale(1.08);
    }

    /* Kayıtlı Şarkılar Bölümü */
    .saved-tracks-section {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #232535;
    }
    .saved-tracks-section h3 {
      font-size: 0.95rem;
      margin-bottom: 12px;
      color: #9da1b9;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .saved-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .saved-card {
      background: #1b1c28;
      border: 1px solid #2d3043;
      padding: 6px 12px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
    }
    .saved-card .title { cursor: pointer; font-weight: 500; }
    .saved-card .title:hover { text-decoration: underline; color: #818cf8; }
    .saved-card .del-btn {
      color: #ef4444;
      cursor: pointer;
      font-weight: bold;
      padding: 0 4px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Müzik & Beat Stüdyosu 🎧</h1>
    <p>Kutucuklara tıkla, ritmini ve arkaplan melodini kendin oluştur!</p>
  </header>

  <div class="studio-container">
    <!-- Üst Kontroller -->
    <div class="top-bar">
      <div class="btn-group">
        <button id="playBtn">▶ Oynat</button>
        <button id="clearBtn">🗑 Temizle</button>
      </div>

      <div class="btn-group">
        <div class="control-label">
          <span>Tempo:</span>
          <input type="range" id="bpmSlider" min="70" max="150" value="105">
          <span id="bpmVal">105 BPM</span>
        </div>
      </div>

      <div class="btn-group">
        <input type="text" id="songName" placeholder="Şarkı Adı..." maxlength="20" style="width: 120px;">
        <button id="saveSongBtn">💾 Siteye Kaydet</button>
        <button id="exportAudioBtn">📥 WAV İndir</button>
      </div>
    </div>

    <!-- Müzik Kanalları (Grid) -->
    <div class="sequencer-grid" id="grid">
      <!-- JavaScript otomatik oluşturacak -->
    </div>

    <!-- Sitede Kayıtlı Olanlar -->
    <div class="saved-tracks-section">
      <h3>📁 Sitede Kayıtlı Parçalarım</h3>
      <div class="saved-list" id="savedList">
        <span style="font-size:0.8rem; color:#60647c;">Henüz kayıtlı bir parça yok.</span>
      </div>
    </div>
  </div>

  <script>
    // Parça Kanalları & Notalar/Frekanslar (Pentatonik Uyumlu)
    const TRACKS = [
      { id: 'kick', name: '🥁 Kick', type: 'drum', freq: 150 },
      { id: 'snare', name: '💥 Snare', type: 'noise' },
      { id: 'hihat', name: '✨ Hi-Hat', type: 'noise-short' },
      { id: 'bass', name: '🎸 Bas', type: 'synth', freq: 65.41 },      // C2
      { id: 'chords', name: '🎹 Akor/Pluck', type: 'synth', freq: 261.63 }, // C4
      { id: 'melody', name: '🔔 Melodi', type: 'bell', freq: 523.25 }    // C5
    ];

    const TOTAL_STEPS = 16;
    let gridState = {}; // { [trackId]: [bool x 16] }
    let isPlaying = false;
    let currentStep = 0;
    let intervalId = null;
    let audioCtx = null;
    let mediaDest = null;
    let mediaRecorder = null;
    let recordedChunks = [];

    // Durumu Sıfırla
    function resetGridState() {
      TRACKS.forEach(t => {
        gridState[t.id] = new Array(TOTAL_STEPS).fill(false);
      });
    }
    resetGridState();

    // Ses Motoru
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        mediaDest = audioCtx.createMediaStreamDestination();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function routeToOutput(node) {
      node.connect(audioCtx.destination);
      if (mediaDest) node.connect(mediaDest);
    }

    // Enstrüman Ses Sentezleyicileri
    function playSound(track) {
      const ctx = getAudioContext();
      const now = ctx.currentTime;

      if (track.id === 'kick') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.35);
        gain.gain.setValueAtTime(1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.connect(gain);
        routeToOutput(gain);
        osc.start(now);
        osc.stop(now + 0.35);
      } 
      else if (track.id === 'snare') {
        // Beyaz Gürültü Trampet
        const bufferSize = ctx.sampleRate * 0.15;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 1000;

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.7, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

        noise.connect(filter);
        filter.connect(gain);
        routeToOutput(gain);
        noise.start(now);
      } 
      else if (track.id === 'hihat') {
        const bufferSize = ctx.sampleRate * 0.04;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 5000;

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);

        noise.connect(filter);
        filter.connect(gain);
        routeToOutput(gain);
        noise.start(now);
      } 
      else if (track.id === 'bass') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(track.freq, now);

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(260, now);

        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

        osc.connect(filter);
        filter.connect(gain);
        routeToOutput(gain);
        osc.start(now);
        osc.stop(now + 0.4);
      } 
      else if (track.id === 'chords') {
        // Yumuşak Lo-Fi Pluck
        [0, 4, 7].forEach((semi, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          const f = track.freq * Math.pow(2, semi / 12);
          osc.frequency.setValueAtTime(f, now);

          gain.gain.setValueAtTime(0.12, now + (idx * 0.015));
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

          osc.connect(gain);
          routeToOutput(gain);
          osc.start(now);
          osc.stop(now + 0.5);
        });
      } 
      else if (track.id === 'melody') {
        // Çan / Sine
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(track.freq, now);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

        osc.connect(gain);
        routeToOutput(gain);
        osc.start(now);
        osc.stop(now + 0.6);
      }
    }

    // Grid'i HTML Olarak İnşa Et
    const gridEl = document.getElementById('grid');
    function buildGrid() {
      gridEl.innerHTML = '';
      TRACKS.forEach(track => {
        const row = document.createElement('div');
        row.className = 'track-row';

        const info = document.createElement('div');
        info.className = 'track-info';
        info.textContent = track.name;
        row.appendChild(info);

        const stepsCont = document.createElement('div');
        stepsCont.className = 'steps-container';

        for (let i = 0; i < TOTAL_STEPS; i++) {
          const btn = document.createElement('div');
          btn.className = `step-btn ${track.id}`;
          if (gridState[track.id][i]) btn.classList.add('active');

          btn.addEventListener('click', () => {
            getAudioContext();
            gridState[track.id][i] = !gridState[track.id][i];
            btn.classList.toggle('active', gridState[track.id][i]);
            if (gridState[track.id][i]) playSound(track);
          });

          stepsCont.appendChild(btn);
        }

        row.appendChild(stepsCont);
        gridEl.appendChild(row);
      });
    }

    // Adım Adım İlerleme (Playhead)
    function step() {
      // Önceki adımların vurgusunu kaldır
      document.querySelectorAll('.step-btn.playing').forEach(el => el.classList.remove('playing'));

      // Şimdiki adımı vurgula ve çalanları tetikle
      TRACKS.forEach((track, trackIdx) => {
        const row = gridEl.children[trackIdx];
        const stepBtn = row.querySelectorAll('.step-btn')[currentStep];
        stepBtn.classList.add('playing');

        if (gridState[track.id][currentStep]) {
          playSound(track);
        }
      });

      currentStep = (currentStep + 1) % TOTAL_STEPS;
    }

    function startPlayback() {
      getAudioContext();
      isPlaying = true;
      playBtn.textContent = '⏹ Durdur';
      playBtn.classList.add('play-active');

      const bpm = parseInt(document.getElementById('bpmSlider').value);
      const intervalMs = (60 / bpm / 4) * 1000; // 16'lık nota aralığı
      intervalId = setInterval(step, intervalMs);
    }

    function stopPlayback() {
      isPlaying = false;
      playBtn.textContent = '▶ Oynat';
      playBtn.classList.remove('play-active');
      clearInterval(intervalId);
      currentStep = 0;
      document.querySelectorAll('.step-btn.playing').forEach(el => el.classList.remove('playing'));
    }

    // Buton Dinleyicileri
    const playBtn = document.getElementById('playBtn');
    playBtn.addEventListener('click', () => {
      if (isPlaying) stopPlayback();
      else startPlayback();
    });

    document.getElementById('bpmSlider').addEventListener('input', (e) => {
      document.getElementById('bpmVal').textContent = `${e.target.value} BPM`;
      if (isPlaying) {
        clearInterval(intervalId);
        const bpm = parseInt(e.target.value);
        intervalId = setInterval(step, (60 / bpm / 4) * 1000);
      }
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      resetGridState();
      buildGrid();
    });

    // Site İçi Kaydetme (LocalStorage)
    function renderSavedList() {
      const listEl = document.getElementById('savedList');
      const saved = JSON.parse(localStorage.getItem('my_beats') || '{}');
      const keys = Object.keys(saved);

      if (keys.length === 0) {
        listEl.innerHTML = '<span style="font-size:0.8rem; color:#60647c;">Henüz kayıtlı bir parça yok.</span>';
        return;
      }

      listEl.innerHTML = '';
      keys.forEach(name => {
        const card = document.createElement('div');
        card.className = 'saved-card';

        const title = document.createElement('span');
        title.className = 'title';
        title.textContent = `🎵 ${name}`;
        title.addEventListener('click', () => {
          gridState = JSON.parse(JSON.stringify(saved[name].state));
          document.getElementById('bpmSlider').value = saved[name].bpm || 105;
          document.getElementById('bpmVal').textContent = `${saved[name].bpm || 105} BPM`;
          buildGrid();
        });

        const del = document.createElement('span');
        del.className = 'del-btn';
        del.textContent = '✕';
        del.addEventListener('click', () => {
          delete saved[name];
          localStorage.setItem('my_beats', JSON.stringify(saved));
          renderSavedList();
        });

        card.appendChild(title);
        card.appendChild(del);
        listEl.appendChild(card);
      });
    }

    document.getElementById('saveSongBtn').addEventListener('click', () => {
      const nameInput = document.getElementById('songName');
      const name = nameInput.value.trim() || `Beat #${Math.floor(Math.random() * 900 + 100)}`;
      const saved = JSON.parse(localStorage.getItem('my_beats') || '{}');
      saved[name] = {
        state: gridState,
        bpm: document.getElementById('bpmSlider').value
      };
      localStorage.setItem('my_beats', JSON.stringify(saved));
      nameInput.value = '';
      renderSavedList();
      alert(`"${name}" site içine kaydedildi!`);
    });

    // 1 Döngü Kaydedip Bilgisayara İndirme (Audio Export)
    const exportBtn = document.getElementById('exportAudioBtn');
    exportBtn.addEventListener('click', () => {
      getAudioContext();
      if (!isPlaying) startPlayback();

      recordedChunks = [];
      mediaRecorder = new MediaRecorder(mediaDest.stream);
      mediaRecorder.ondataavailable = (e) => recordedChunks.push(e.data);
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'audio/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'muzigim.webm';
        a.click();
        exportBtn.textContent = '📥 WAV İndir';
        exportBtn.classList.remove('record-active');
      };

      mediaRecorder.start();
      exportBtn.textContent = '🔴 Kaydediliyor...';
      exportBtn.classList.add('record-active');

      // 1 tam döngü (16 adım) bittiğinde otomatik durdur ve indir
      const bpm = parseInt(document.getElementById('bpmSlider').value);
      const totalLoopTime = ((60 / bpm / 4) * 16) * 1000;
      setTimeout(() => {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
          mediaRecorder.stop();
        }
      }, totalLoopTime);
    });

    // Başlangıç Kurulumu
    buildGrid();
    renderSavedList();
  </script>
</body>
</html>
